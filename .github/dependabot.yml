version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped so a quiet week is one reviewable PR rather than a dozen.
    groups:
      next:
        patterns:
          - next
          - "@next/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      ai-sdk:
        patterns:
          - ai
          - "@ai-sdk/*"
          - "@openrouter/*"
      tooling:
        patterns:
          - oxlint
          - oxfmt
          - knip
          - lefthook
          - vitest
          - typescript
          - "@types/node"
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
